name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run linter
        run: npm run lint

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git xvfb scrot zip curl libxml2-dev libxslt1-dev

      - name: Install Google Chrome
        run: |
          wget -q -O google-chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i google-chrome.deb || sudo apt-get -f install -y
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Install ChromeDriver
        run: |
          CHROME_VERSION=$(google-chrome --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+')
          if [ -z "$CHROME_VERSION" ]; then
            echo "Não foi possível obter a versão do Google Chrome." >&2
            exit 1
          fi
          echo "Versão do Chrome instalada: ${CHROME_VERSION}"
          CHROME_MAJOR=$(echo "$CHROME_VERSION" | cut -d. -f1)
          echo "Versão major do Chrome: ${CHROME_MAJOR}"
          CHROMEDRIVER_VERSION=$(curl -sS "https://chromedriver.storage.googleapis.com/LATEST_RELEASE_${CHROME_MAJOR}")
          if [ -z "$CHROMEDRIVER_VERSION" ]; then
            echo "Não foi possível obter a versão do ChromeDriver para o Chrome major $CHROME_MAJOR." >&2
            exit 1
          fi
          echo "Versão do ChromeDriver a ser instalada: ${CHROMEDRIVER_VERSION}"
          wget -q -O chromedriver.zip https://chromedriver.storage.googleapis.com/${CHROMEDRIVER_VERSION}/chromedriver_linux64.zip
          unzip chromedriver.zip
          sudo mv chromedriver /usr/bin/chromedriver
          sudo chmod +x /usr/bin/chromedriver

      - name: Set up Python environment
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          source venv/bin/activate
          pip install robotframework robotframework-seleniumlibrary

      - name: Wait for server to start
        run: |
          for i in {1..30}; do
            curl -sSf http://localhost:5173 && break
            echo "Waiting for server to start..."
            sleep 5
          done

      - name: Run Chrome Robot Tests
        run: |
          source venv/bin/activate
          xvfb-run robot \
            --variable BROWSER:chrome \
            --outputdir robot/results \
            robot/tests
        shell: bash

      - name: Upload Robot Framework Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-reports
          path: robot/results/

      - name: Build project
        run: npm run build