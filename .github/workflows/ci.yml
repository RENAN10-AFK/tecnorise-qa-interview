name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run linter
        run: npm run lint

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git xvfb scrot zip curl libxml2-dev libxslt1-dev

      - name: Set up Python environment
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          source venv/bin/activate
          pip install robotframework robotframework-seleniumlibrary

      - name: Configure browser for Robot Framework
        run: |
          sudo apt-get install -y chromium-browser
          export BROWSER=chromium
          export PATH=$PATH:/usr/bin/chromium-browser

      - name: Run tests
        run: |
          source venv/bin/activate
          npm run dev &
          sleep 10 # Aguarda o servidor iniciar
          robot --outputdir robot/results robot/tests

      - name: Upload Robot Framework Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-reports
          path: robot/results/

      - name: Build project
        run: npm run build