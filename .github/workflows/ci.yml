name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run linter
        run: npm run lint

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git xvfb scrot zip curl libxml2-dev libxslt1-dev

      - name: Install Google Chrome
        run: |
          wget -q -O google-chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i google-chrome.deb || sudo apt-get -f install -y
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Set up Python environment
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          source venv/bin/activate
          pip install robotframework robotframework-seleniumlibrary

      - name: Start server
        run: npm run dev &

      - name: Wait for server to start
        run: |
          for i in {1..30}; do
            curl -sSf http://localhost:5173 && break
            echo "Waiting for server to start..."
            sleep 5
          done

      - name: Run Chrome Robot Tests
        run: |
          source venv/bin/activate
          xvfb-run robot --variable BROWSER:chrome --outputdir robot/results robot/tests
        shell: bash

      - name: Upload Robot Framework Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-reports
          path: robot/results/

      - name: Build project
        run: npm run build