name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: |
          npm run dev &
          sleep 10 # Aguarda o servidor iniciar
          robot --outputdir robot/results robot/tests

      - name: Upload test results
        uses: actions/upload-artifact@v3
        with:
          name: robot-test-results
          path: robot/results/*

      - name: Upload Robot Framework Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-reports
          path: robot/results/

      - name: Build project
        run: npm run build