name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run linter
        run: npm run lint

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git xvfb scrot zip curl libxml2-dev libxslt1-dev

      - name: Install Google Chrome
        run: |
          wget -q -O google-chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i google-chrome.deb || sudo apt-get -f install -y
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Set up Python environment
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          source venv/bin/activate
          pip install robotframework robotframework-seleniumlibrary

      - name: Run tests
        env:
          CHROME_BIN: /usr/bin/google-chrome-stable
        run: |
          # Inicia o servidor em background com xvfb para servir de display virtual
          xvfb-run -a npm run dev &
          sleep 10  # Aguarda o servidor iniciar
          # Executa os testes robot usando xvfb
          xvfb-run -a robot --outputdir robot/results robot/tests

      - name: Upload Robot Framework Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-reports
          path: robot/results/

      - name: Build project
        run: npm run build